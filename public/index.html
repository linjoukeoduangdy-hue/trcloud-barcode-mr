<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>ตัดสต๊อก · TRCloud</title>
<script src="/html5-qrcode.min.js" defer></script>
<style>
  :root {
    --bg: #14181c;
    --panel: #1c2126;
    --panel-2: #232a31;
    --line: #303941;
    --text: #e9edf1;
    --text-dim: #8b98a3;
    --amber: #f2b705;
    --amber-dim: #7a5e02;
    --green: #3fbf6f;
    --red: #e6584b;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  header h1 {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  header .sub {
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .user-box {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logout-btn {
    background: var(--panel-2);
    color: var(--text-dim);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
  }
  .logout-btn:hover { color: var(--red); border-color: var(--red); }

  .net-status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    font-family: var(--mono);
  }
  .net-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-dim); flex-shrink: 0;
  }
  .net-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .net-dot.offline { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .queue-badge {
    background: var(--amber); color: #1a1400;
    font-weight: 700; border-radius: 999px;
    padding: 1px 8px; font-size: 11px;
  }
  .sync-now-btn {
    margin-left: auto;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 10px; font-size: 11px; cursor: pointer;
  }
  .sync-now-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .unverified-tag { color: var(--amber); font-size: 11px; }

  #toast {
    position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 480px; margin: 0 auto;
    padding: 12px 14px; border-radius: 8px; font-size: 13px;
    display: none; text-align: center; z-index: 999;
    border: 1px solid var(--line);
  }
  #toast.show { display: block; }
  #toast.ok { background: rgba(63,191,111,0.15); color: var(--green); border-color: rgba(63,191,111,0.3); }
  #toast.err { background: rgba(230,88,75,0.15); color: var(--red); border-color: rgba(230,88,75,0.3); }
  #toast.info { background: var(--panel-2); color: var(--text); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 16px;
    padding-bottom: 140px; /* กันโดน sticky bar ทับ */
  }

  /* ---------- Scan panel ---------- */
  .scan-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }

  .scan-tabs {
    display: flex;
  }

  .scan-tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    background: var(--panel-2);
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }

  .scan-tab.active {
    color: var(--amber);
    border-bottom-color: var(--amber);
    background: var(--panel);
  }

  .scan-body { padding: 16px; }

  #camera-view {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
    min-height: 220px;
  }

  .usb-hint {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 10px;
    line-height: 1.5;
  }

  #usb-input {
    width: 100%;
    padding: 16px;
    font-size: 20px;
    font-family: var(--mono);
    background: var(--bg);
    border: 2px solid var(--amber-dim);
    border-radius: 8px;
    color: var(--text);
    outline: none;
  }

  #usb-input:focus {
    border-color: var(--amber);
  }

  .hidden { display: none !important; }

  /* ---------- Scan feedback toast ---------- */
  #scan-feedback {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-family: var(--mono);
    display: none;
  }
  #scan-feedback.show { display: block; }
  #scan-feedback.ok { background: rgba(63,191,111,0.12); color: var(--green); border: 1px solid rgba(63,191,111,0.3); }
  #scan-feedback.err { background: rgba(230,88,75,0.12); color: var(--red); border: 1px solid rgba(230,88,75,0.3); }

  /* ---------- Cart ---------- */
  .cart-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 4px;
  }

  .cart-header h2 {
    font-size: 14px;
    text-transform: none;
    color: var(--text-dim);
    font-weight: 600;
    margin: 0;
  }

  .cart-count {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--amber);
  }

  .cart-empty {
    padding: 32px 16px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    border: 1px dashed var(--line);
    border-radius: 10px;
  }

  .cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }

  .cart-item .info { flex: 1; min-width: 0; }

  .cart-item .sku {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--amber);
  }

  .cart-item .name {
    font-size: 14px;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .qty-control {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .qty-btn {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .qty-val {
    min-width: 28px;
    text-align: center;
    font-family: var(--mono);
    font-size: 15px;
  }

  .remove-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
  }
  .remove-btn:hover { color: var(--red); }

  /* ---------- Header info form ---------- */
  .info-form {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    display: grid;
    gap: 10px;
  }

  .info-form label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .info-form input,
  .info-form select {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .info-form input:focus,
  .info-form select:focus { border-color: var(--amber); }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .fixed-info {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
    line-height: 1.7;
    border-top: 1px dashed var(--line);
    padding-top: 10px;
    margin-top: 2px;
  }
  .fixed-info b { color: var(--text); font-weight: 600; }

  /* ---------- Sticky submit bar ---------- */
  .submit-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--panel-2);
    border-top: 1px solid var(--line);
    padding: 14px 16px;
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .submit-bar .total {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    flex-shrink: 0;
  }

  .submit-btn {
    flex: 1;
    padding: 14px;
    border-radius: 8px;
    border: none;
    background: var(--amber);
    color: #1a1400;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }

  .submit-btn:disabled {
    background: var(--line);
    color: var(--text-dim);
    cursor: not-allowed;
  }

  /* ---------- Result modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
    max-width: 360px;
    width: 100%;
    text-align: center;
  }

  .modal .icon { font-size: 40px; margin-bottom: 8px; }
  .modal h3 { margin: 0 0 8px; font-size: 17px; }
  .modal p { margin: 0 0 18px; font-size: 13px; color: var(--text-dim); font-family: var(--mono); word-break: break-word; }

  .modal button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: var(--amber);
    color: #1a1400;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>ຕັດສະຕ໊ອກດ້ວຍບາໂຄດ</h1>
  <span class="user-box">
    <span id="user-name" class="sub"></span>
    <button id="logout-btn" class="logout-btn">ອອກລະບົບ</button>
  </span>
</header>

<div id="net-status" class="net-status">
  <span id="net-dot" class="net-dot"></span>
  <span id="net-text">ກຳລັງກວດສອບ...</span>
  <span id="queue-badge" class="queue-badge hidden">0</span>
  <button id="sync-now-btn" class="sync-now-btn hidden">ສົ່ງທີ່ຄ້າງໄວ້</button>
</div>

<main>
  <div class="scan-panel">
    <div class="scan-tabs">
      <button class="scan-tab active" data-mode="camera">📷 ກ້ອງ</button>
      <button class="scan-tab" data-mode="usb">⌨️ ເຄື່ອງຍິງ USB</button>
    </div>
    <div class="scan-body">
      <div id="camera-mode">
        <div id="camera-view"></div>
      </div>
      <div id="usb-mode" class="hidden">
        <div class="usb-hint">ຍິງບາໂຄດດ້ວຍເຄື່ອງຍິງ USB ໄດ້ເລີຍ (ຊ່ອງນີ້ຮັບຄ່າອັດຕະໂນມັດ) ຫລືພິມ SKU ແລ້ວກົດ Enter</div>
        <input id="usb-input" type="text" placeholder="ຍິງ ຫລື ພິມ SKU..." autocomplete="off" />
      </div>
      <div id="scan-feedback"></div>
    </div>
  </div>

  <div class="info-form">
    <div>
      <label>ຊື່ (name)</label>
      <input id="f-name" type="text" placeholder="ຊື່ເອກະສານ" />
    </div>
    <div>
      <label>ຜູ້ເບີກ (request_by)</label>
      <input id="f-request-by" type="text" placeholder="ຊື່ຜູ້ເບີກ" />
    </div>
    <div>
      <label>ຈຸດປະສົງ (purpose)</label>
      <input id="f-purpose" type="text" placeholder="ເຊັ່ນ: ນຳໄປໃຊ້ໜ້າງານ..." />
    </div>
    <div class="fixed-info" id="fixed-info"></div>
  </div>

  <div class="cart-section">
    <div class="cart-header">
      <h2>ລາຍການທີ່ຈະເບີກ</h2>
      <span class="cart-count" id="cart-count">0 ລາຍການ</span>
    </div>
    <div id="cart-list" style="margin-top:10px;">
      <div class="cart-empty" id="cart-empty">ຍັງບໍ່ມີລາຍການ — ເລີ່ມຍິງບາໂຄດເບື້ອງເທິງ</div>
    </div>
  </div>
</main>

<div class="submit-bar">
  <span class="total" id="submit-total">0 ລາຍການ</span>
  <button class="submit-btn" id="submit-btn" disabled>ຢືນຢັນເບີກສິນຄ້າ</button>
</div>

<div class="modal-overlay" id="result-modal">
  <div class="modal">
    <div class="icon" id="modal-icon">✅</div>
    <h3 id="modal-title">ສຳເລັດ</h3>
    <p id="modal-detail"></p>
    <button id="modal-close">ປິດ</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ---------------- State ----------------
let cart = []; // { product_id, product_name, quantity, unit }

// ---------------- Tab switching ----------------
const tabs = document.querySelectorAll(".scan-tab");
const cameraMode = document.getElementById("camera-mode");
const usbMode = document.getElementById("usb-mode");
const usbInput = document.getElementById("usb-input");
let html5QrCode = null;

tabs.forEach((tab) => {
  tab.addEventListener("click", () => {
    tabs.forEach((t) => t.classList.remove("active"));
    tab.classList.add("active");
    const mode = tab.dataset.mode;
    if (mode === "camera") {
      cameraMode.classList.remove("hidden");
      usbMode.classList.add("hidden");
      startCamera();
    } else {
      usbMode.classList.remove("hidden");
      cameraMode.classList.add("hidden");
      stopCamera();
      usbInput.focus();
    }
  });
});

// ---------------- Camera scanning ----------------
function startCamera() {
  if (html5QrCode) return;
  html5QrCode = new Html5Qrcode("camera-view");
  html5QrCode
    .start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 260, height: 140 } },
      (decodedText) => {
        handleScan(decodedText);
      },
      () => {} // เพิกเฉย error ระหว่างสแกน (ยังไม่เจอโค้ด)
    )
    .catch((err) => {
      showFeedback("err", "ເປີດກ້ອງບໍ່ສຳເລັດ: " + err);
      html5QrCode = null;
    });
}

function stopCamera() {
  if (html5QrCode) {
    const instance = html5QrCode;
    html5QrCode = null; // ປ່ອຍໄວ້ກ່ອນ ເພື່ອບໍ່ໃຫ້ startCamera() ຕິດ guard ຈາກ instance ເກົ່າ
    instance
      .stop()
      .then(() => instance.clear())
      .catch(() => {}); // ລໍ stop() ໃຫ້ແລ້ວກ່ອນ clear() ຈຶ່ງບໍ່ຂຶ້ນ "Cannot clear while scan is ongoing"
  }
}

// ---------------- USB scanner (keyboard wedge) ----------------
usbInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const value = usbInput.value.trim();
    usbInput.value = "";
    if (value) handleScan(value);
  }
});

// ---------------- Local product cache (ສຳລັບໃຊ້ຕອນອອບລາຍ) ----------------
const PRODUCT_CACHE_KEY = "trcloud-product-cache";

function getProductCache() {
  try {
    return JSON.parse(localStorage.getItem(PRODUCT_CACHE_KEY)) || {};
  } catch {
    return {};
  }
}

function cacheProduct(product) {
  try {
    const cache = getProductCache();
    cache[product.product_id] = product;
    localStorage.setItem(PRODUCT_CACHE_KEY, JSON.stringify(cache));
  } catch (err) {
    console.error("[cache] ບັນທຶກແຄຊ໌ບໍ່ສຳເລັດ:", err.message);
  }
}

// ---------------- Handle a scanned code ----------------
let scanning = false;
async function handleScan(code) {
  if (scanning) return; // กันยิงซ้ำรัว ๆ ระหว่างรอ lookup
  scanning = true;
  showFeedback("ok", `ກຳລັງກວດ "${code}" ...`);

  try {
    const resp = await fetch(`/api/lookup?sku=${encodeURIComponent(code)}`);

    if (resp.status === 401) {
      window.location.href = "/login.html";
      return;
    }

    const data = await resp.json();

    if (!resp.ok) {
      showFeedback("err", data.error || "ບໍ່ພົບສິນຄ້າ");
    } else {
      cacheProduct(data);
      addToCart(data, true);
      showFeedback("ok", `✓ ${data.product_id} — ${data.product_name}`);
    }
  } catch (err) {
    // ເຊື່ອມຕໍ່ບໍ່ໄດ້ (ອອບລາຍ) — ລອງໃຊ້ຂໍ້ມູນທີ່ເຄີຍແຄຊ໌ໄວ້, ຖ້າບໍ່ມີ ໃຫ້ເພີ່ມແບບຍັງບໍ່ຢືນຢັນ
    const cache = getProductCache();
    const cached = cache[code];
    if (cached) {
      addToCart(cached, true);
      showFeedback("ok", `✓ (ອອບລາຍ/ແຄຊ໌) ${cached.product_id} — ${cached.product_name}`);
    } else {
      addToCart({ product_id: code, product_name: code, unit: "", cost: null }, false);
      showFeedback("err", `⚠ ອອບລາຍ — ບໍ່ຮູ້ຈັກລະຫັດນີ້ ຈະຕັດຢືນຢັນຊື່/ລາຄາຄືນຕອນມີເນັດ`);
    }
  } finally {
    setTimeout(() => { scanning = false; }, 400);
  }
}

function showFeedback(type, message) {
  const el = document.getElementById("scan-feedback");
  el.textContent = message;
  el.className = `show ${type}`;
}

// ---------------- Cart management ----------------
function addToCart(product, verified) {
  const existing = cart.find((it) => it.product_id === product.product_id);
  if (existing) {
    existing.quantity += 1;
    if (verified) existing.verified = true; // ຖ້າຢືນຢັນຄືນຕອນມີເນັດ ອັບເດດໃຫ້ຖືກ
  } else {
    cart.push({
      product_id: product.product_id,
      product_name: product.product_name,
      unit: product.unit,
      cost: product.cost ?? null,
      quantity: 1,
      verified: !!verified,
    });
  }
  renderCart();
}

function changeQty(productId, delta) {
  const item = cart.find((it) => it.product_id === productId);
  if (!item) return;
  item.quantity += delta;
  if (item.quantity <= 0) {
    cart = cart.filter((it) => it.product_id !== productId);
  }
  renderCart();
}

function removeItem(productId) {
  cart = cart.filter((it) => it.product_id !== productId);
  renderCart();
}

function renderCart() {
  const list = document.getElementById("cart-list");
  const count = document.getElementById("cart-count");
  const submitBtn = document.getElementById("submit-btn");
  const submitTotal = document.getElementById("submit-total");

  count.textContent = `${cart.length} ລາຍການ`;
  submitTotal.textContent = `${cart.length} ລາຍການ`;
  submitBtn.disabled = cart.length === 0;

  if (cart.length === 0) {
    // ສ້າງ empty-state ຂຶ້ນໃໝ່ທຸກຄັ້ງ ແທນທີ່ຈະອີງໃສ່ node ເກົ່າທີ່ອາດຖືກລົບໄປແລ້ວ
    // ໂດຍ innerHTML = "" ຄັ້ງກ່ອນໜ້າ (ນັ້ນຄືສາເຫດຂອງ appendChild(null) error)
    list.innerHTML = `<div class="cart-empty" id="cart-empty">ຍັງບໍ່ມີລາຍການ — ເລີ່ມຍິງບາໂຄດເບື້ອງເທິງ</div>`;
    return;
  }

  list.innerHTML = "";
  cart.forEach((item) => {
    const row = document.createElement("div");
    row.className = "cart-item";
    row.innerHTML = `
      <div class="info">
        <div class="sku">${item.product_id}</div>
        <div class="name">${item.product_name}${item.verified ? "" : ' <span class="unverified-tag">⚠ ຍັງບໍ່ຢືນຢັນ</span>'}</div>
      </div>
      <div class="qty-control">
        <button class="qty-btn" data-action="dec" data-id="${item.product_id}">−</button>
        <span class="qty-val">${item.quantity}</span>
        <button class="qty-btn" data-action="inc" data-id="${item.product_id}">+</button>
      </div>
      <button class="remove-btn" data-action="remove" data-id="${item.product_id}">✕</button>
    `;
    list.appendChild(row);
  });
}

document.getElementById("cart-list").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  if (action === "inc") changeQty(id, 1);
  if (action === "dec") changeQty(id, -1);
  if (action === "remove") removeItem(id);
});

// ---------------- Submit ----------------
// ---------------- ຄິວລໍສົ່ງ (ຕອນອອບລາຍ) ----------------
const QUEUE_KEY = "trcloud-pending-mr-queue";
let isFlushingQueue = false;

function getQueue() {
  try {
    return JSON.parse(localStorage.getItem(QUEUE_KEY)) || [];
  } catch {
    return [];
  }
}

function saveQueue(queue) {
  localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
  updateQueueUI();
}

function enqueue(payload) {
  const queue = getQueue();
  queue.push({ id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, payload });
  saveQueue(queue);
}

function showToast(type, message) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.className = `show ${type}`;
  setTimeout(() => { el.className = ""; }, 4000);
}

// ສົ່ງໄປ /api/submit-mr — ໃຊ້ຮ່ວມກັນລະຫວ່າງການສົ່ງໂດຍກົງ ແລະ ການສົ່ງຄິວທີ່ຄ້າງໄວ້
async function postSubmitMR(payload) {
  try {
    const resp = await fetch("/api/submit-mr", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (resp.status === 401) {
      return { networkError: false, sessionExpired: true };
    }
    const data = await resp.json();
    return { networkError: false, ok: resp.ok, data };
  } catch (err) {
    return { networkError: true, error: err };
  }
}

async function flushQueue() {
  if (isFlushingQueue || !navigator.onLine) return;
  const queue = getQueue();
  if (queue.length === 0) return;

  isFlushingQueue = true;
  document.getElementById("sync-now-btn").disabled = true;

  while (true) {
    const current = getQueue();
    if (current.length === 0) break;
    const item = current[0];

    const result = await postSubmitMR(item.payload);

    if (result.networkError) {
      break; // ยังออฟไลน์อยู่จริง — เลิกลอง ไว้รอบหน้า
    }

    if (result.sessionExpired) {
      // session ໝົດອາຍຸ — ຄ້າງລາຍການໄວ້ໃນຄິວ (ບໍ່ລົບ) ແລ້ວໃຫ້ login ໃໝ່ກ່ອນ ຈະສົ່ງຄືນຄັ້ງຕໍ່ໄປ
      window.location.href = "/login.html";
      break;
    }

    // ไม่ว่าจะสำเร็จหรือ TRCloud ปฏิเสธ ก็นำออกจากคิว (ส่งซ้ำเหมือนเดิมจะไม่ทำให้ผลต่างไปจากเดิม)
    saveQueue(getQueue().filter((q) => q.id !== item.id));

    if (result.ok && result.data.success === 1) {
      showToast("ok", `✓ ສົ່ງທີ່ຄ້າງໄວ້ສຳເລັດ (ຜູ້ເບີກ: ${item.payload.request_by || "-"})`);
    } else {
      showModal(
        false,
        "ລາຍການທີ່ຄ້າງໄວ້ສົ່ງບໍ່ສຳເລັດ",
        `ຜູ້ເບີກ: ${item.payload.request_by || "-"} — ${result.data?.message || result.data?.error || "TRCloud ປະຕິເສດ"}`
      );
      break; // หยุดไว้ให้ผู้ใช้เห็น ไม่ยิงต่อจนล้นกันไปหมด
    }
  }

  isFlushingQueue = false;
  updateQueueUI();
}

function updateQueueUI() {
  const queue = getQueue();
  const badge = document.getElementById("queue-badge");
  const syncBtn = document.getElementById("sync-now-btn");

  if (queue.length > 0) {
    badge.textContent = queue.length;
    badge.classList.remove("hidden");
    syncBtn.classList.remove("hidden");
    syncBtn.disabled = !navigator.onLine || isFlushingQueue;
  } else {
    badge.classList.add("hidden");
    syncBtn.classList.add("hidden");
  }
}

function updateNetStatus() {
  const dot = document.getElementById("net-dot");
  const text = document.getElementById("net-text");
  if (navigator.onLine) {
    dot.className = "net-dot online";
    text.textContent = "ອອນລາຍ";
    flushQueue();
  } else {
    dot.className = "net-dot offline";
    text.textContent = "ອອບລາຍ — ຍິງໄດ້ປົກກະຕິ ຈະສົ່ງເມື່ອກັບມາອອນລາຍ";
  }
  updateQueueUI();
}

window.addEventListener("online", updateNetStatus);
window.addEventListener("offline", updateNetStatus);
document.getElementById("sync-now-btn").addEventListener("click", flushQueue);
setInterval(() => { if (navigator.onLine) flushQueue(); }, 20000);

document.getElementById("submit-btn").addEventListener("click", async () => {
  const submitBtn = document.getElementById("submit-btn");
  submitBtn.disabled = true;
  submitBtn.textContent = "ກຳລັງສົ່ງ...";

  const payload = {
    items: cart,
    name: document.getElementById("f-name").value,
    request_by: document.getElementById("f-request-by").value,
    purpose: document.getElementById("f-purpose").value,
  };

  const result = await postSubmitMR(payload);

  if (result.networkError) {
    enqueue(payload);
    showModal(
      true,
      "ບໍ່ມີອິນເຕີເນັດ — ບັນທຶກໄວ້ລໍສົ່ງແລ້ວ",
      "ລະບົບຈະສົ່ງໃຫ້ອັດຕະໂນມັດທັນທີທີ່ກັບມາອອນລາຍ (ຫລືກົດ 'ສົ່ງທີ່ຄ້າງໄວ້' ດ້ວຍຕົນເອງ) — ຈຳໄວ້ວ່າສະຕ໊ອກຍັງບໍ່ຖືກຕັດຈົນກວ່າຈະສົ່ງສຳເລັດ"
    );
    resetFormForNextDocument();
  } else if (result.ok && result.data.success === 1) {
    showModal(true, "ເບີກສິນຄ້າສຳເລັດ", result.data.message || JSON.stringify(result.data));
    resetFormForNextDocument();
  } else {
    showModal(false, "ສົ່ງບໍ່ສຳເລັດ", result.data.message || result.data.error || JSON.stringify(result.data));
  }

  submitBtn.textContent = "ຢືນຢັນເບີກສິນຄ້າ";
  submitBtn.disabled = cart.length === 0;
});

function resetFormForNextDocument() {
  cart = [];
  renderCart();
  document.getElementById("f-name").value = "";
  document.getElementById("f-request-by").value = "";
  document.getElementById("f-purpose").value = "";
  const feedback = document.getElementById("scan-feedback");
  if (feedback) {
    feedback.textContent = "";
    feedback.className = "";
  }
}

function showModal(ok, title, detail) {
  document.getElementById("modal-icon").textContent = ok ? "✅" : "⚠️";
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-detail").textContent = detail;
  document.getElementById("result-modal").classList.add("show");
}
document.getElementById("modal-close").addEventListener("click", () => {
  document.getElementById("result-modal").classList.remove("show");
});

// ---------------- Fixed values (ສະແດງໃຫ້ຮູ້ເທົ່ານັ້ນ ແກ້ບໍ່ໄດ້) ----------------
const FIXED_INFO_CACHE_KEY = "trcloud-fixed-info-cache";

function renderFixedInfo(d) {
  const box = document.getElementById("fixed-info");
  box.innerHTML = `
    ຄັງສິນຄ້າ: <b></b><br>
    ແຜນກ: <b></b><br>
    ສູດບັນຊີ: <b></b><br>
    ສະຖານະ: <b></b>
  `;
  const slots = box.querySelectorAll("b");
  slots[0].textContent = d.warehouse || "-";
  slots[1].textContent = d.department || "-";
  slots[2].textContent = d.accounting_formula || "-";
  slots[3].textContent = d.status || "-";
}

async function loadFixedInfo() {
  try {
    const resp = await fetch("/api/form-options");
    const d = await resp.json();
    localStorage.setItem(FIXED_INFO_CACHE_KEY, JSON.stringify(d));
    renderFixedInfo(d);
  } catch (err) {
    // ອອບລາຍ — ໃຊ້ຄ່າທີ່ເຄີຍແຄຊ໌ໄວ້ຄັ້ງກ່ອນແທນ
    try {
      const cached = JSON.parse(localStorage.getItem(FIXED_INFO_CACHE_KEY));
      if (cached) {
        renderFixedInfo(cached);
        return;
      }
    } catch {}
    document.getElementById("fixed-info").textContent = "ໂຫລດຂໍ້ມູນຄ່າຄົງທີ່ບໍ່ສຳເລັດ (ບໍ່ມີອິນເຕີເນັດ ແລະ ບໍ່ເຄີຍໂຫລດມາກ່ອນ)";
  }
}

// ---------------- ຜູ້ໃຊ້ທີ່ login ຢູ່ ----------------
const USER_CACHE_KEY = "trcloud-current-user";

async function loadCurrentUser() {
  try {
    const resp = await fetch("/api/me");
    if (resp.status === 401) {
      // session ໝົດອາຍຸ ຫລືຍັງບໍ່ login ແທ້ — ສົ່ງໄປໜ້າ login
      window.location.href = "/login.html";
      return;
    }
    const data = await resp.json();
    localStorage.setItem(USER_CACHE_KEY, JSON.stringify(data));
    document.getElementById("user-name").textContent = `👤 ${data.display_name}`;
  } catch (err) {
    // ອອບລາຍ — ບໍ່ຮູ້ວ່າ session ຍັງໃຊ້ໄດ້ບໍ, ໃຫ້ໃຊ້ຄ່າແຄຊ໌ໄວ້ສະແດງ ບໍ່ redirect ຫນີໄປ
    try {
      const cached = JSON.parse(localStorage.getItem(USER_CACHE_KEY));
      if (cached) {
        document.getElementById("user-name").textContent = `👤 ${cached.display_name} (ອອບລາຍ)`;
      }
    } catch {}
  }
}

document.getElementById("logout-btn").addEventListener("click", async () => {
  try {
    await fetch("/api/logout", { method: "POST" });
  } catch {}
  localStorage.removeItem(USER_CACHE_KEY);
  window.location.href = "/login.html";
});

// ---------------- Init ----------------
loadCurrentUser();
loadFixedInfo();
updateNetStatus();

if (typeof Html5Qrcode !== "undefined") {
  startCamera();

  window.addEventListener("load", startCamera);

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch((err) => {
      console.error("[sw] ລົງທະບຽນ service worker ບໍ່ສຳເລັດ:", err.message);
